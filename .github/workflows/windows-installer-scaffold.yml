name: windows-installer-scaffold

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE/vcpkg"
          & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat"

      - name: Configure (Release)
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE" -B "$env:GITHUB_WORKSPACE/build/ci-installer" -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build runtime binaries (Release)
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE/build/ci-installer" --config Release --target redclaw_desktop redclaw_host_service

      - name: Setup WiX CLI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          echo "$env:USERPROFILE/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          pwsh -File "$env:GITHUB_WORKSPACE/installer/scripts/build-wix-installer.ps1" `
            -Configuration Release `
            -Version 0.1.1-ci `
            -BuildOutputDirectory "$env:GITHUB_WORKSPACE/build/ci-installer/src/Release"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: redclaw-windows-installer-msi
          path: build/installer/Release/*.msi
          if-no-files-found: error
