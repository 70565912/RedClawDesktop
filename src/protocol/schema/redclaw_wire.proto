  sint32 desktop_origin_y = 4;
  uint32 pixel_width = 5;
  uint32 pixel_height = 6;
  uint32 rotation = 7;
  bool primary = 8;
}

message StreamControlMessageV1 {
  int32 schema_version = 1;
  StreamControlMessageTypeV1 type = 2;
  string session_epoch = 3;
  uint64 message_id = 4;
  uint64 sent_at_ms = 5;
  uint32 viewport_width = 6;
  uint32 viewport_height = 7;
  uint32 encoded_width = 8;
  uint32 encoded_height = 9;
  uint32 target_fps = 10;
  uint32 target_bitrate_kbps = 11;
  uint64 received_bytes = 12;
  uint64 received_frames = 13;
  uint64 decoded_frames = 14;
  uint64 rendered_frames = 15;
  uint64 dropped_frames = 16;
  uint64 reassembly_timeouts = 17;
  uint64 received_fragments = 18;
  uint64 reassembled_frames = 19;
  uint64 completed_keyframes = 20;
  uint64 dropped_keyframes = 21;
  uint64 playback_starvation_count = 22;
  uint64 incomplete_frame_id = 23;
  uint64 latest_received_frame_id = 24;
  uint64 latest_complete_frame_id = 25;
  uint64 latest_complete_keyframe_id = 26;
  uint64 observed_rate_revision = 27;
  uint64 source_activity_revision = 28;
  DesktopSourceActivityStateV1 source_activity_state = 29;
  bool media_budget_waiting = 30;
  uint64 reference_frame_id = 31;
  uint64 reference_keyframe_id = 32;
  uint64 stream_geometry_revision = 33;
  uint64 rate_revision = 34;
  uint64 observed_source_activity_revision = 35;
  uint64 latest_displayable_frame_id = 36;
  uint64 latest_displayable_keyframe_id = 37;
  uint64 latest_presented_frame_id = 38;
  uint32 rtt_ms = 39;
  uint64 transport_feedback_id = 40;
  repeated MediaTransportArrivalV1 media_transport_arrivals = 41;
  string request_id = 42;
  RemoteLogModeV1 log_mode = 43;
  uint64 log_cursor = 44;
  uint32 chunk_index = 45;
  bool complete = 46;
  bool gap = 47;
  bytes payload = 48;
  bool input_supported = 49;
  bool input_authorized = 50;
  bool input_requested_active = 51;
  RemoteInputControlStateV1 input_state = 52;
  RemoteInputStatusReasonV1 input_reason = 53;
  uint64 input_sequence = 54;
  sint32 desktop_origin_x = 55;
  sint32 desktop_origin_y = 56;
  uint32 desktop_width = 57;
  uint32 desktop_height = 58;
  uint32 desktop_rotation = 59;
  uint64 desktop_geometry_revision = 60;
  uint32 pressed_mouse_buttons = 61;
  repeated uint32 pressed_scan_codes = 62;
  repeated RemoteInputEventV1 input_events = 63;
  repeated DesktopDisplayV1 desktop_displays = 64;
  uint64 display_catalog_revision = 65;
  string display_id = 66;
  uint32 region_left = 67;
  uint32 region_top = 68;
  uint32 region_right = 69;
  uint32 region_bottom = 70;
  uint64 capture_region_revision = 71;
  uint32 content_rect_x = 72;
  uint32 content_rect_y = 73;
  uint32 content_rect_width = 74;
  uint32 content_rect_height = 75;
