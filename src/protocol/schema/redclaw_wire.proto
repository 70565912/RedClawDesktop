message AgentMessageEnvelopeV1 {
  int32 schema_version = 1;
  string session_epoch = 2;
  uint64 message_id = 3;
  uint64 sent_at_ms = 4;
  string task_id = 5;
  string request_id = 6;
  string supersedes_request_id = 7;
  uint64 event_sequence = 8;
  AgentMessageTypeV1 type = 9;
  AgentProviderKindV1 provider = 10;
  AgentProviderReadinessV1 provider_readiness = 11;
  AgentWorkDirectoryModeV1 work_directory_mode = 12;
  AgentTaskStateV1 task_state = 13;
  AgentApprovalDecisionV1 approval_decision = 14;
  string model = 15;
  string project_id = 16;
  string display_name = 17;
  string event_kind = 18;
  string error_code = 19;
  string evidence_manifest_name = 20;
  string evidence_sha256 = 21;
  bytes text = 22; // Stream chunks may split a UTF-8 code point.
  uint64 acknowledged_event_sequence = 23;
  bool available = 24;
  bool complete = 25;
  bool gap = 26;
  bool git_repository = 27;
  bool requires_turn_approval = 28;
  bool supports_structured_approval = 29;
}

message RemoteInputEventV1 {
  RemoteInputEventTypeV1 type = 1;
  uint32 scan_code = 2;
  uint32 virtual_key = 3;
  bool extended = 4;
  bool repeat = 5;
  uint32 normalized_x = 6;
  uint32 normalized_y = 7;
