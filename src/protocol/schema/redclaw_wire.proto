  string role = 2;
  string description_type = 3;
  bytes description_sdp = 4;
  bytes publisher_instance_id = 5;
  uint64 generation = 6;
  string connection_request_tag = 7;
  string answered_description_tag = 8;
  string acknowledged_answer_tag = 9;
  bool candidates_complete = 10;
  repeated bytes candidate_lines = 11;
}

enum DebugBridgeMessageTypeV1 {
  DebugBridgeMessageTypeV1_kHello = 0;
  DebugBridgeMessageTypeV1_kHeartbeat = 1;
  DebugBridgeMessageTypeV1_kStatusRequest = 2;
  DebugBridgeMessageTypeV1_kStatusResponse = 3;
  DebugBridgeMessageTypeV1_kCommandRequest = 4;
  DebugBridgeMessageTypeV1_kCommandResult = 5;
  DebugBridgeMessageTypeV1_kAgentFrame = 6;
  DebugBridgeMessageTypeV1_kError = 7;
}

message DebugBridgeEnvelopeV1 {
  int32 schema_version = 1;
  string bridge_id = 2;
  string session_epoch = 3;
  uint64 message_id = 4;
  uint64 sequence = 5;
  uint64 acknowledged_sequence = 6;
  uint64 sent_at_ms = 7;
  DebugBridgeMessageTypeV1 type = 8;
  string request_id = 9;
  string action = 10;
  bytes payload = 11;
  bool ok = 12;
  string error_code = 13;
}
