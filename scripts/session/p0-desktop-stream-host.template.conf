# P0 dual-machine desktop stream profile (Host, diagnostic-only TCP)
# This file is not the formal P0 acceptance path.
# Formal validation now uses the desktop UI machine-code workflow with signal_transport=rendezvous.
# Copy this file before editing machine-specific values.
# Usage:
#   redclaw_desktop.exe --cli --runtime-config scripts/session/p0-desktop-stream-host.template.conf

role=host
# Optional local IPv4 network exit for ICE/STUN/TURN.
# network_bind_address=192.0.2.20
signal_transport=tcp
target_port=45909
signal_dir=runtime-signaling-p0-host
signal_timeout_seconds=20
run_seconds=60
enable_ice_tcp=false

# Stream smoke validates the Host -> Controller preview path.
# Strict capture mode fails the Host run if no real desktop frame is captured.
stream_smoke=true
stream_require_capture=true
stream_preview_width=160
stream_video_max_width=0
# Ordinary-desktop keyboard/mouse control is always opt-in.
allow_remote_input=false
allow_remote_agent=false

# Repeatable ICE entries are supported. For same-LAN validation this is usually optional.
ice_server=stun:stun.l.google.com:19302

# For TURN relay diagnostics, add provider-specific relay URIs here.
# ice_servers=stun:stun1.example.com:3478, turn:relay.example.com:3478

cli=true
