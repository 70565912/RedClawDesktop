# RedClaw runtime profile template (host)
# Usage:
#   redclaw_desktop.exe --cli --runtime-config scripts/session/runtime-profile-host.template.conf

role=host
signal_transport=file
signal_dir=runtime-signaling
# signal_transport=rendezvous
# rendezvous_url=https://rendezvous.example.com/api
# signal_transport=dht
# session_code=A1B2C3D4
# Optional: bind DHT, ICE/STUN/TURN, and UPnP to one assigned local IPv4; unset means Auto.
# network_bind_address=192.0.2.20
ice_udp_port=55000
# dht_bootstrap=router.bittorrent.com:6881
# dht_bootstrap=dht.transmissionbt.com:6881
# dht_bootstrap=dht.libtorrent.org:25401
# dht_bootstrap=router.utorrent.com:6881
# enable_port_mapping=false
# enable_ipv6_candidates=true
# helper_role=client
# signal_transport=sealed-file
# signal_passphrase=change-me-at-least-16
signal_timeout_seconds=120
run_seconds=0
enable_ice_tcp=false

# Ordinary-desktop keyboard/mouse control is always opt-in.
allow_remote_input=false
allow_remote_agent=false
# Local-only file: project_id|display_name|absolute_path. Never transmit paths.
# agent_project_manifest=runtime-agent-projects.conf

# Repeatable single ICE entries are supported.
ice_server=stun:stun.l.google.com:19302

# Comma-separated list is also supported.
# ice_servers=stun:stun1.example.com:3478, turn:relay.example.com:3478

# Optional: force CLI when using profile.
cli=true
