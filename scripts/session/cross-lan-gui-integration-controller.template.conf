# Cross-LAN GUI integration profile (Controller)
# Fixed session code — must match docs/testing/cross-lan-dual-machine-integration-playbook.md
# Prefer: scripts/service/run-cross-lan-gui-integration.ps1 -Role controller

role=controller
signal_transport=dht
# Optional: bind DHT, ICE/STUN/TURN, and UPnP to one active local IPv4 address.
# network_bind_address=192.0.2.20
ice_udp_port=55000
session_code=RC7TST01
signal_dir=runtime-signaling-cross-lan-controller
signal_timeout_seconds=0
run_seconds=0
enable_ice_tcp=true
enable_port_mapping=true
stream_smoke=true
stream_video_max_width=0
ice_server=stun:stun.l.google.com:19302
dht_bootstrap=router.bittorrent.com:6881
dht_bootstrap=dht.transmissionbt.com:6881
dht_bootstrap=dht.libtorrent.org:25401
dht_bootstrap=router.utorrent.com:6881
dht_poll_interval_ms=1000
dht_publish_retry_ms=1000
